<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />
    <title>Tatva Direct (Offline)</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 24px; background: #0b1220; color: #e5e7eb; }
      .card { max-width: 720px; margin: 0 auto; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 18px 16px; }
      h1 { margin: 0 0 8px 0; font-size: 20px; }
      p { margin: 8px 0; color: #cbd5e1; line-height: 1.4; }
      code { background: #0b1220; padding: 2px 6px; border-radius: 8px; border: 1px solid #1f2937; }
      .hint { margin-top: 12px; font-size: 14px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>Tatva Direct can still work in limited mode if the app was opened before.</p>
      <p class="hint">If you’re using POS, any checkout you do while offline should be queued and synced once you’re back online.</p>
      <p class="hint">Try again when your connection returns, or go back to the app: <code>/</code></p>
    </div>
  </body>
</html>
