services:
  - type: web
    name: tatva-direct-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PM_API_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        value: https://project-frontend-git-main-pranshus-projects-2ecfd5c2.vercel.app,https://tatva-direct-frontend-five.vercel.app,https://tatva-direct.vercel.app,https://tatva-direct.netlify.app,https://*.vercel.app,https://*.netlify.app
      - key: PORT
        value: "10000"
      